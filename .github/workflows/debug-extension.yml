name: Debug Extension Merge

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clean build
        run: ./gradlew clean build --stacktrace
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find extension.mpe
        run: find . -iname "*.mpe"

      - name: Inspect extension.mpe files
        run: |
          find . -iname "extension.mpe" | while read f; do
            echo "=== $f ==="
            file "$f"
            echo "--- size ---"
            ls -la "$f"
            echo "--- grep KeepAliveService ---"
            strings "$f" | grep -i KeepAliveService || echo "NOT FOUND in $f"
            echo ""
          done

      - name: Upload mpp for inspection
        uses: actions/upload-artifact@v4
        with:
          name: built-mpp
          path: patches/build/libs/*.mpp
