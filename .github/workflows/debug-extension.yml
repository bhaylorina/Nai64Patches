name: Debug Extension Merge

on:
  workflow_dispatch:   # lets you trigger it manually from the Actions tab

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clean build
        run: ./gradlew clean build --stacktrace
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find extension.mpe
        run: find . -iname "*.mpe"

      - name: List extension.mpe contents
        run: |
          MPE=$(find . -iname "extension.mpe" | head -n 1)
          echo "Found: $MPE"
          unzip -l "$MPE"

      - name: Grep for KeepAliveService inside extension.mpe
        run: |
          MPE=$(find . -iname "extension.mpe" | head -n 1)
          mkdir -p /tmp/mpe_check
          unzip -o "$MPE" -d /tmp/mpe_check
          find /tmp/mpe_check -iname "*.dex" -o -iname "*.class" | while read f; do
            echo "--- $f ---"
            strings "$f" | grep -i KeepAliveService || echo "not found in $f"
          done

      - name: Upload mpp for inspection
        uses: actions/upload-artifact@v4
        with:
          name: built-mpp
          path: patches/build/libs/*.mpp
